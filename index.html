<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A市一中校园网 · 论坛（实时）</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="index.html">
      <strong>A市一中校园网</strong>
      <small>A市一中 · 仅校内可见</small>
    </a>
    <nav class="nav">
      <a href="#">论坛</a>
      <a href="#">私信</a>
      <a href="#">站规</a>
    </nav>
    
    <div class="timeline-selector">
      <span>时间线：</span>
      <select onchange="if(this.value) window.location.href=this.value;">
        <option value="index.html" selected>当前</option>
        <!-- 未来你可以加在这里：<option value="chapter_oct.html">十月</option> -->
      </select>
    </div>

    <button class="theme-btn" type="button" onclick="toggleTheme()" id="themeBtn">夜间模式</button>
  </div>
</header>

<div class="notice-bar">
  <strong>公告：</strong>校园网将于本周五 23:00 进行维护。请勿在树洞发布真实姓名、宿舍号与联系方式。
</div>

<main class="layout">
  <div class="main-col">
    
    <!-- 1. 列表视图 -->
    <div id="view-list">
      <div class="identity-bar">
        <div style="display: flex; align-items: center; gap: 12px;">
          当前身份：<span class="badge">匿名访客</span>
          <button class="btn-new-post" onclick="window.location.href='generator.html'">✏️ 发帖</button>
        </div>
        <label class="search">
          搜索帖子
          <input id="post-search" type="search" placeholder="输入关键字...">
        </label>
      </div>

      <div class="board-nav" id="board-nav"></div>

      <section>
        <div class="post-list" id="post-list"></div>
      </section>
    </div>

    <!-- 2. 帖子详情视图 -->
    <div id="view-detail" class="hidden">
      <button class="btn-back" onclick="backTo('list')">← 返回帖子列表</button>
      <article class="post-detail">
        <h1 id="detail-title"></h1>
        <div class="meta detail-meta" id="detail-meta"></div>
        <div class="post-body" id="detail-content"></div>
        <div class="reply-list">
          <h2 id="detail-reply-title">全部回复</h2>
          <div id="detail-replies"></div>
        </div>
      </article>
    </div>

    <!-- 3. 个人主页视图 -->
    <div id="view-profile" class="hidden">
      <button class="btn-back" onclick="backTo('list')">← 返回帖子列表</button>
      <div class="profile-alert">🔒 你还不是她的好友，她只公开了一部分信息！</div>
      <article class="post-detail" style="padding-top: 10px;">
        <h1 id="profile-name" style="margin-bottom: 20px;"></h1>
        <h2 style="font-size: 16px; border-left: 3px solid var(--accent); padding-left: 8px;">Ta 的帖子</h2>
        <div class="post-list" id="profile-post-list" style="margin-top: 16px;"></div>
      </article>
    </div>

  </div>

  <aside class="sidebar">
    <section class="widget">
      <h3>版规摘要</h3>
      <p>禁止人肉、禁止公开真实姓名与宿舍号、禁止造谣。树洞匿名不等于无痕，违规内容将按站规处理。</p>
    </section>
  </aside>
</main>

<footer class="footer">y8《在你十七岁的那个夏夜》·校园网模拟器</footer>

<script src="main.js"></script>
